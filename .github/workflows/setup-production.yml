name: Set up production (Supabase database + Vercel env)

# Run from GitHub → Actions → "Set up production" → Run workflow.
# You are prompted for the Supabase address and anon key (both browser-safe).
# Server-only values come from GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY, VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID,
#   RESEND_API_KEY, RESEND_FROM (optional: skipped when empty)
on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Supabase project address (https://xxxx.supabase.co)'
        required: true
      supabase_anon_key:
        description: 'Supabase anon / publishable key'
        required: true
      run_sql:
        description: 'Run docs/supabase-schema.sql on the database (only on a fresh project)'
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run database schema
        if: ${{ inputs.run_sql }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Add the SUPABASE_DB_URL repo secret first."; exit 1; }
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f docs/supabase-schema.sql

      - name: Add environment variables to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          IN_URL: ${{ inputs.supabase_url }}
          IN_ANON: ${{ inputs.supabase_anon_key }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_PROJECT_ID" || { echo "Add VERCEL_TOKEN and VERCEL_PROJECT_ID repo secrets first."; exit 1; }
          Q="upsert=true"; test -n "$VERCEL_ORG_ID" && Q="$Q&teamId=$VERCEL_ORG_ID"
          put() { # name value type
            [ -z "$2" ] && { echo "skip $1 (empty)"; return; }
            body=$(jq -n --arg k "$1" --arg v "$2" --arg t "$3" '{key:$k,value:$v,type:$t,target:["production","preview"]}')
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?$Q" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' -d "$body")
            [ "$code" -lt 300 ] && echo "set $1" || { echo "failed $1 ($code)"; jq -r '.error.message // .' /tmp/r.json; exit 1; }
          }
          put VITE_SUPABASE_URL "$IN_URL" plain
          put SUPABASE_URL "$IN_URL" plain
          put VITE_SUPABASE_ANON_KEY "$IN_ANON" plain
          put SUPABASE_ANON_KEY "$IN_ANON" plain
          put SUPABASE_SERVICE_ROLE_KEY "$SERVICE_ROLE" sensitive
          put RESEND_API_KEY "$RESEND_API_KEY" sensitive
          put RESEND_FROM "$RESEND_FROM" plain
          echo "Done. Redeploy in Vercel to apply."
